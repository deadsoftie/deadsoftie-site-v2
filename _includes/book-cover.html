{% assign book = include.book %}
<div class="book-cover" style="--cover: oklch({{ book.cover_color }});">
  {% if book.cover_image %}
  <img
    class="book-cover-img"
    src="{{ book.cover_image }}"
    alt=""
    loading="lazy"
    onerror="this.remove()"
  />
  {% endif %}
  <div class="book-title">{{ book.title }}</div>
  <div class="book-author">{{ book.author }}</div>
</div>
