<!-- Google Fonts: Archivo drives the whole UI; JetBrains Mono is kept only for code blocks -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
  rel="stylesheet"
/>

<!-- Styles -->
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />

<!-- SEO: title + description both come from here now — page.summary (essays)
     falls back to page.description (e.g. Valley Chief) then site.description,
     so nothing upstream needs to hand-roll a <title>/<meta description> too -->
{% assign seo_description = page.summary | default: page.description | strip_html | truncatewords: 30 %}
{% seo description=seo_description %}

<!-- Feed -->
<link
  rel="alternate"
  type="application/atom+xml"
  title="deadsoftie"
  href="{{ '/feed.xml' | relative_url }}"
/>
