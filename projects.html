---
layout: default
title: Projects
---

<div class="container" style="padding-top: 56px; padding-bottom: 80px">
  <div class="eyebrow" style="margin-bottom: 8px">projects</div>
  <h1 class="h-display" style="font-size: 38px; margin: 0 0 32px">Projects</h1>

  {% assign sorted_projects = site.projects | sort: "order" %}
  <div class="projects-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px">
    {% for project in sorted_projects %}
    {% include project-card.html project=project %}
    {% endfor %}
  </div>
</div>
