---
layout: default
---

<article class="container" style="padding-top: 56px; padding-bottom: 80px; max-width: 760px">
  <div style="margin-bottom: 28px">
    <a href="{{ '/notes' | relative_url }}" style="font-size: 12px; color: var(--muted)">← Notes</a>
  </div>

  <div style="font-size: 12px; color: var(--muted); margin-bottom: 10px">
    {{ page.date | date: "%-d %b %Y" }}
    {% if page.updated and page.updated != page.date %} · updated {{ page.updated | date: "%-d %b %Y" }}{% endif %}
  </div>

  <h1 class="h-display" style="font-size: 32px; margin: 0 0 16px">{{ page.title }}</h1>

  <div style="display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 32px">
    {% for tag in page.tags %}
    <a href="{{ '/notes' | relative_url }}?tag={{ tag }}" class="tag">#{{ tag }}</a>
    {% endfor %}
  </div>

  <div class="prose">{{ content }}</div>
</article>
